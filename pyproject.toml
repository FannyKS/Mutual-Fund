[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mutual-fund"
version = "0.1.0"
description = "Daily, weekly and monthly market value reports for mutual fund accounts"
requires-python = ">=3.9"

[project.scripts]
mutual-fund = "mutual_fund.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
